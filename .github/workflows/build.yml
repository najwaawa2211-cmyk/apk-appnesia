name: Build Capacitor APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install & Obfuscate
        run: |
          # Install semua dependensi Capacitor dan Obfuscator
          npm install
          npm install javascript-obfuscator @capacitor/cli @capacitor/core @capacitor/android
          
          # Jalankan robot pengacak
          node acak.js

      - name: Build Android
        run: |
          # Cek kalau folder android belum ada, baru di-add
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          
          # Sinkronisasi file www (yang udah acak) ke Android
          npx cap sync android
          
          # Build APK
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Appnesia-Capacitor-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
