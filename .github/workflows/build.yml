name: Build Capacitor APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Karena package.json sudah ada, npm install akan berjalan normal tanpa error
      - name: Build Android APK with Capacitor
        run: |
          npm install

          # Inisialisasi Capacitor menggunakan konfigurasi appnesia
          npx cap init Appnesia com.appnesia.web --web-dir www

          # Buat folder www dan salin file web kamu (index.html dan data.js)
          mkdir -p www
          if [ -f "index.html" ]; then
            cp index.html www/index.html
          else
            echo "<h1>Appnesia</h1>" > www/index.html
          fi

          if [ -f "data.js" ]; then
            cp data.js www/data.js
          fi

          # Tambahkan platform android dan sinkronkan
          npx cap add android
          npx cap sync android

          # Masuk ke folder android lalu build apk debug
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Appnesia-Capacitor-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
