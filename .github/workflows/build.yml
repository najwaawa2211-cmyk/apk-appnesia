name: Build APK Appnesia

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # KITA GANTI KE JAVA 21 SESUAI PERMINTAAN ERROR
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Build APK with Capacitor
        run: |
          # Bersihkan folder lama
          rm -rf web-app
          
          # Install Capacitor
          npm install -g @capacitor/cli @capacitor/core @capacitor/android
          mkdir web-app && cd web-app
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          # Buat konfigurasi
          echo '{
            "appId": "com.appnesia.web",
            "appName": "Appnesia",
            "webDir": "www",
            "bundledWebRuntime": false
          }' > capacitor.config.json
          
          mkdir www
          cp ../index.html ./www/
          cp ../data.js ./www/
          
          # Tambah Android
          npx cap add android
          
          # Arahkan ke SDK bawaan GitHub
          echo "sdk.dir=/usr/local/lib/android/sdk" > android/local.properties
          
          cd android
          chmod +x gradlew
          
          # Jalankan build
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Appnesia-APK
          path: web-app/android/app/build/outputs/apk/debug/app-debug.apk
