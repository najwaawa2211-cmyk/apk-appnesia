name: Build APK Appnesia

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli @capacitor/core @capacitor/android

      - name: Create Capacitor Project
        run: |
          # Membuat folder kerja baru
          mkdir web-app && cd web-app
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          # Inisialisasi Capacitor
          npx cap init Appnesia com.appnesia.web --web-dir=www
          mkdir www
          
          # Copy file HTML dan JS kamu ke folder www
          cp ../index.html www/
          cp ../data.js www/
          
          # Tambah platform Android
          npx cap add android

      - name: Build APK
        run: |
          cd web-app/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Appnesia-APK
          path: web-app/android/app/build/outputs/apk/debug/app-debug.apk
