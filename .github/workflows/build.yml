name: Build APK Appnesia

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Pakai template WebView super simpel (gak pakai Capacitor/Cordova)
      - name: Build APK with WebView Template
        run: |
          # Download template Android WebView yang sudah jadi
          git clone https://github.com/uriklar/simple-webview-apk.git android-app
          
          # Masukkan file web lu ke dalam template
          cp index.html android-app/app/src/main/assets/index.html
          cp data.js android-app/app/src/main/assets/data.js
          
          # Ganti nama aplikasi di manifest (opsional, biar keren)
          sed -i 's/SimpleWebView/Appnesia/g' android-app/app/src/main/res/values/strings.xml
          sed -i 's/com.example.simplewebview/com.appnesia.web/g' android-app/app/build.gradle
          
          # Build APK
          cd android-app
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Appnesia-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
