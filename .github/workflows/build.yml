name: Build APK Appnesia

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 1. Setup Android SDK (Tanpa action pembungkus)
      - name: Setup Android SDK
        run: |
          # Set environment variable
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
          
          # Download command line tools
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q tools.zip
          mv cmdline-tools latest
          
          # Terima semua lisensi secara otomatis (INI SOLUSI ERROR KAMU)
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          
          # Install platform yang dibutuhkan Capacitor
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      # 2. Build pakai Capacitor
      - name: Create Capacitor Project & Build
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          
          npm install -g @capacitor/cli @capacitor/core @capacitor/android
          mkdir web-app && cd web-app
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          npx cap init Appnesia com.appnesia.web --web-dir=www
          mkdir www
          cp ../index.html www/
          cp ../data.js www/
          
          npx cap add android
          
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Appnesia-APK
          path: web-app/android/app/build/outputs/apk/debug/app-debug.apk
