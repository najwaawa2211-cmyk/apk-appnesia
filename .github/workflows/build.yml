name: Build Capacitor APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies & Obfuscate
        run: |
          # 1. Pastikan package.json ada (jika belum ada di repo, buat otomatis)
          if [ ! -f "package.json" ]; then
            npm init -y
          fi

          # 2. Install semua modul yang dibutuhkan termasuk obfuscator & capacitor
          npm install javascript-obfuscator @capacitor/cli @capacitor/core @capacitor/android

          # 3. Jalankan skrip pengacak (acak.js)
          node acak.js

      - name: Build Android
        run: |
          # Inisialisasi capacitor jika belum tersetting
          if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
            npx cap init Appnesia com.appnesia.web --web-dir www
          fi

          # Cek kalau folder android belum ada, baru di-add
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          
          # Sinkronisasi folder www (hasil acakan) ke Android
          npx cap sync android
          
          # Build APK Debug
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Appnesia-Capacitor-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
