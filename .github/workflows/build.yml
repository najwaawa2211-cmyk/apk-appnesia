name: Build Capacitor APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Android APK with Capacitor
        run: |
          npm install
          npm install javascript-obfuscator

          # JALANKAN 2 ROBOT TERPISAH
          node acak-data.js
          node acak-index.js

          npx cap init Appnesia com.appnesia.web --web-dir www
          npx cap add android
          npx cap sync android

          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Appnesia-Capacitor-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
