name: Build Capacitor APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies & Obfuscate
        run: |
          # 1. Pastikan package.json ada
          if [ ! -f "package.json" ]; then
            npm init -y
          fi

          # 2. Install semua modul
          npm install javascript-obfuscator @capacitor/cli @capacitor/core @capacitor/android

          # 3. Jalankan skrip pengacak (acak.js)
          node acak.js

      - name: Build Android
        run: |
          # Inisialisasi capacitor jika belum tersetting
          if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
            npx cap init Appnesia com.appnesia.web --web-dir www
          fi

          # Cek kalau folder android belum ada
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          
          # Sinkronisasi
          npx cap sync android
          
          # Build APK Release (Kita ubah dari debug ke release)
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          cd ..

      # ==========================================
      # TAMBAHAN: BIKIN KEYSTORE & TANDA TANGANI
      # ==========================================
      - name: Generate Keystore
        run: |
          keytool -genkey -v \
            -keystore appnesia.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias ${{ secrets.ALIAS }} \
            -storepass ${{ secrets.PASS }} \
            -keypass ${{ secrets.KEYPASS }} \
            -dname "CN=Appnesia, O=Appnesia, C=ID"

      - name: Sign APK
        run: |
          # Cari file APK hasil build tadi
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          
          # Tanda tangani APK-nya
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks appnesia.jks \
            --ks-pass pass:${{ secrets.PASS }} \
            --key-pass pass:${{ secrets.KEYPASS }} \
            --ks-key-alias ${{ secrets.ALIAS }} \
            --out appnesia-signed.apk \
            "$APK"

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Appnesia-Signed-APK
          path: appnesia-signed.apk
