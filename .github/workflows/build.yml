name: Build APK Appnesia

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova Project
        run: |
          cordova create app com.appnesia.web Appnesia
          cp index.html app/www/index.html
          cp data.js app/www/data.js
          # Salin semua file lain jika ada (misal gambar/CSS eksternal)
          # cp -r assets/* app/www/ || true
          
      - name: Add Android Platform
        run: |
          cd app
          cordova platform add android

      - name: Build APK
        run: |
          cd app
          cordova build android

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Appnesia-APK
          path: app/platforms/android/app/build/outputs/apk/debug/*.apk
