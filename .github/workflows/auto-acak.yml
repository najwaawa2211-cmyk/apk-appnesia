name: Build APK Acak

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Ambil Kode Asli
        uses: actions/checkout@v3

      - name: 2. Siapin Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: 3. Install Alat Pengacak
        run: npm install javascript-obfuscator

      - name: 4. Jalankan Robot Acak.js
        run: node acak.js

      - name: 5. Setup Capacitor & Sync (Masukin file acak ke Android)
        run: |
          npm install
          npx cap sync android

      - name: 6. Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
