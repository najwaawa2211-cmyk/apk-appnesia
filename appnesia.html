<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Appnesia — Toko Aplikasi Nusantara</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='26' fill='%23ff6b35'/><g stroke='%23ffffff' stroke-width='10' stroke-linecap='round' fill='none'><path d='M50 27L75 73'/><path d='M50 27L25 73'/><path d='M34 61L66 61'/></g></svg>">
<style>
  :root{
    --bg:#f4f6f9; --surface:#ffffff; --surface-2:#eef2f7;
    --text:#0f172a; --muted:#64748b; --border:#e2e8f0;
    --accent:#ff6b35; --ok:#22c55e;
    --shadow:0 12px 28px -14px rgba(15,23,42,.35);
  }
  [data-theme="dark"]{
    --bg:#0a111f; --surface:#121b2b; --surface-2:#1a2437;
    --text:#e7eefc; --muted:#8fa0b8; --border:#22304a;
    --accent:#ff7d4d; --ok:#34d399;
    --shadow:0 14px 32px -16px rgba(0,0,0,.8);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif;
    -webkit-font-smoothing:antialiased;
    transition:background .25s, color .25s;
    min-height:100vh;
  }
  button,a{font-family:inherit}
  [hidden]{display:none !important}

  /* TOPBAR */
  .topbar{ position:sticky; top:0; z-index:50; background:color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-bottom:1px solid var(--border); }
  .topbar-inner{ max-width:1180px; margin:0 auto; padding:12px 18px; display:flex; align-items:center; gap:14px; }
  .brand{display:flex; align-items:center; gap:10px; flex-shrink:0}
  .brand-logo{ width:38px;height:38px;border-radius:12px; overflow:hidden; flex-shrink:0; box-shadow:0 6px 16px -6px var(--accent); }
  .brand-logo svg{width:100%;height:100%;display:block}
  .brand h1{font-size:17px;margin:0;letter-spacing:-.3px;line-height:1.1}
  .brand small{font-size:10.5px;color:var(--muted);letter-spacing:.4px}
  .search{ flex:1; display:flex; align-items:center; gap:9px; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:0 14px; height:42px; max-width:520px; margin-left:auto; transition:border-color .2s, box-shadow .2s; }
  .search:focus-within{border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
  .search svg{width:17px;height:17px;stroke:var(--muted);flex-shrink:0}
  .search input{ border:0; outline:0; background:transparent; color:var(--text); font-size:14px; width:100%; }
  .search input::placeholder{color:var(--muted)}
  .icon-btn{ width:42px;height:42px;border-radius:13px;flex-shrink:0; background:var(--surface); border:1px solid var(--border); cursor:pointer; font-size:17px; display:grid; place-items:center; transition:transform .15s, border-color .15s; position:relative; }
  .icon-btn:hover{transform:translateY(-2px); border-color:var(--accent)}
  .icon-btn .badge-dot{ position:absolute; top:-4px; right:-4px; min-width:17px; height:17px; padding:0 4px; background:var(--accent); color:#fff; border-radius:10px; font-size:10px; font-weight:800; display:grid; place-items:center; box-shadow:0 0 0 2px var(--bg); font-family:system-ui,sans-serif; }

  /* LAYOUT */
  .wrap{max-width:1180px; margin:0 auto; padding:22px 18px 70px}
  section{margin-bottom:34px}
  .sec-title{font-size:16px; margin:0 0 14px; letter-spacing:-.3px}

  /* HERO */
  .hero{ background:#0f172a; border-radius:22px; padding:28px; color:#fff; margin-bottom:34px; position:relative; overflow:hidden; min-height:220px; display:flex; flex-direction:column; justify-content:center; }
  .hero-video-wrap { position:absolute; inset:0; z-index:0; pointer-events:none; overflow:hidden; background:#0f172a; }
  .hero-video-wrap iframe { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); border:0; pointer-events:none; aspect-ratio:16/9; width:max(100%,177.78vh); height:max(100%,56.25vw); min-width:100%; min-height:100%; }
  .hero-video-wrap.no-video{ background:linear-gradient(135deg,#ff6b35 0%,#ffb627 100%); }
  .hero-video-wrap.no-video ~ .hero-overlay{ background:linear-gradient(100deg, rgba(15,23,42,.55) 0%, rgba(15,23,42,.35) 55%, rgba(15,23,42,.10) 100%); }
  .hero-overlay{ position:absolute; inset:0; z-index:1; background:linear-gradient(100deg, rgba(15,23,42,.88) 0%, rgba(15,23,42,.65) 45%, rgba(15,23,42,.15) 100%); pointer-events:none; }
  .hero-badge{ display:inline-flex; align-items:center; gap:5px; background:rgba(255,255,255,.2); padding:5px 12px; border-radius:20px; font-size:11px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; backdrop-filter:blur(6px); margin-bottom:16px; position:relative; z-index:2; align-self:flex-start; }
  .hero-sponsor{ position:absolute; top:16px; right:16px; font-size:10px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; background:rgba(0,0,0,.5); padding:5px 10px; border-radius:20px; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); z-index:3; display:inline-flex; align-items:center; gap:5px; pointer-events:none; }
  .hero-content{ display:flex; gap:18px; align-items:center; position:relative; z-index:2; }
  .hero-icon{ width:84px; height:84px; border-radius:20px; background:#fff; display:grid; place-items:center; font-size:44px; flex-shrink:0; box-shadow:0 12px 24px -10px rgba(0,0,0,.55); }
  .hero-text{min-width:0; flex:1}
  .hero-text h1{ font-size:24px; margin:0 0 5px; letter-spacing:-.5px; line-height:1.15; color:#fff; }
  .hero-text p{ font-size:13.5px; margin:0 0 8px; color:rgba(255,255,255,.92); line-height:1.4; }
  .hero-meta{font-size:11.5px; color:rgba(255,255,255,.7); margin-bottom:14px}
  .hero-actions{display:flex; gap:8px; flex-wrap:wrap}
  .hero-btn{ padding:9px 18px; border-radius:11px; font-size:12.5px; font-weight:700; text-decoration:none; border:0; cursor:pointer; font-family:inherit; display:inline-flex; align-items:center; gap:6px; transition:filter .15s, transform .1s; }
  .hero-btn:active{transform:scale(.97)}
  .hero-btn.primary{background:#fff; color:#0f172a}
  .hero-btn.primary:hover{filter:brightness(.95)}
  .hero-btn.ghost{ background:rgba(255,255,255,.15); color:#fff; box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.4); backdrop-filter:blur(6px); }
  .hero-btn.ghost:hover{background:rgba(255,255,255,.25)}

  /* KATEGORI */
  .cat-scroll{ display:flex; gap:10px; overflow-x:auto; padding:2px 2px 8px; scrollbar-width:none; margin:0 -2px; }
  .cat-scroll::-webkit-scrollbar{display:none}
  .cat-tile{ min-width:80px; padding:11px 8px; border-radius:16px; background:var(--surface); border:1px solid var(--border); display:flex; flex-direction:column; align-items:center; gap:5px; cursor:pointer; transition:transform .15s, border-color .15s, background .15s; font-family:inherit; color:var(--text); flex-shrink:0; }
  .cat-tile:hover{border-color:var(--accent); transform:translateY(-2px)}
  .cat-tile.active{ border-color:var(--accent); background:color-mix(in srgb, var(--accent) 10%, var(--surface)); }
  .cat-tile .cat-emoji{font-size:24px; line-height:1}
  .cat-tile .cat-name{ font-size:11px; font-weight:600; letter-spacing:-.1px; text-align:center; white-space:nowrap; }
  .cat-tile .cat-count{font-size:9px; color:var(--muted); font-weight:500}

  /* PERINGKAT */
  .rank-list{ list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:8px; }
  .rank-item{ display:flex; align-items:center; gap:14px; padding:12px 16px; background:var(--surface); border:1px solid var(--border); border-radius:14px; cursor:pointer; transition:border-color .15s, transform .15s; }
  .rank-item:hover{border-color:var(--accent); transform:translateX(3px)}
  .rank-num{ font-size:22px; font-weight:800; color:var(--muted); min-width:32px; letter-spacing:-1px; font-variant-numeric:tabular-nums; }
  .rank-item:nth-child(-n+3) .rank-num{color:var(--accent)}
  .rank-icon{ width:44px; height:44px; border-radius:12px; display:grid; place-items:center; font-size:22px; flex-shrink:0; box-shadow:inset 0 0 0 1px rgba(255,255,255,.25); }
  .rank-info{flex:1; min-width:0}
  .rank-info h3{ font-size:13.5px; margin:0 0 2px; font-weight:650; letter-spacing:-.2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rank-info p{ font-size:11px; margin:0; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rank-arrow{color:var(--muted); font-size:16px; flex-shrink:0}

  /* GRID & KARTU */
  .section-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px; }
  .section-head .sec-title{margin:0}
  #countLabel{font-size:12px; color:var(--muted)}
  .grid{ display:grid; gap:12px; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); }
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:13px; display:flex; flex-direction:column; gap:9px; cursor:pointer; transition:transform .16s, box-shadow .16s, border-color .16s; }
  .card:hover{transform:translateY(-3px); box-shadow:var(--shadow); border-color:transparent}
  .card-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .app-icon{ width:48px; height:48px; border-radius:13px; display:grid; place-items:center; font-size:24px; flex-shrink:0; box-shadow:inset 0 0 0 1px rgba(255,255,255,.25); }
  .mini-dl{ width:26px; height:26px; border-radius:8px; background:var(--surface-2); display:grid; place-items:center; color:var(--muted); text-decoration:none; flex-shrink:0; transition:background .15s, color .15s; }
  .mini-dl:hover{background:var(--accent); color:#fff}
  .mini-dl svg{width:13px; height:13px}
  .card h3{ font-size:13px; margin:0; font-weight:650; letter-spacing:-.2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .card .dev{ font-size:10.5px; color:var(--muted); margin:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .card-cat{ display:inline-block; font-size:9px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; color:var(--muted); padding:2px 7px; border-radius:6px; background:var(--surface-2); align-self:flex-start; margin-top:2px; }

  /* KOSONG */
  .empty{ grid-column:1/-1; text-align:center; padding:60px 20px; color:var(--muted); }
  .empty-icon{font-size:44px; margin-bottom:12px; opacity:.6}
  .empty p{margin:0 0 5px; font-size:14px; font-weight:600; color:var(--text)}
  .empty span{font-size:12.5px}

  /* MODAL */
  .backdrop{ position:fixed; inset:0; z-index:100; background:rgba(6,12,22,.55); backdrop-filter:blur(5px); display:none; align-items:center; justify-content:center; padding:20px; }
  .backdrop.show{display:flex}
  .modal{ background:var(--surface); border-radius:24px; width:100%; max-width:480px; max-height:88vh; overflow-y:auto; padding:22px; position:relative; box-shadow:0 30px 70px -20px rgba(0,0,0,.55); animation:pop .22s ease; border:1px solid var(--border); }
  @keyframes pop{from{transform:translateY(14px) scale(.97); opacity:0} to{transform:none; opacity:1}}
  .modal-close{ position:absolute; top:14px; right:14px; width:32px; height:32px; border-radius:50%; border:1px solid var(--border); background:var(--surface); color:var(--muted); cursor:pointer; font-size:13px; display:grid; place-items:center; }
  .modal-close:hover{color:var(--text); border-color:var(--accent)}
  .modal-head{ display:flex; gap:14px; align-items:center; margin-bottom:18px; padding-right:36px; }
  .app-icon.big{width:74px;height:74px;border-radius:20px;font-size:38px}
  .modal-head h2{font-size:19px; margin:0 0 3px; letter-spacing:-.4px}
  .modal-head .dev{font-size:12px; color:var(--muted); margin:0 0 8px}
  .badge-row{display:flex; gap:6px; flex-wrap:wrap}
  .badge{ font-size:10px; font-weight:700; letter-spacing:.4px; text-transform:uppercase; padding:4px 9px; border-radius:20px; background:var(--surface-2); color:var(--muted); }
  .badge.ok{background:color-mix(in srgb,var(--ok) 18%,transparent); color:var(--ok)}
  .modal h4{font-size:13px; margin:0 0 8px; letter-spacing:-.2px}
  .desc{font-size:13px; line-height:1.6; color:var(--muted); margin:0 0 18px}
  .modal-actions{display:grid; gap:10px}
  .modal-actions .btn{ padding:13px; border-radius:13px; font-size:14px; font-weight:700; cursor:pointer; border:0; text-decoration:none; text-align:center; display:grid; place-items:center; transition:filter .15s, transform .1s; }
  .modal-actions .btn:active{transform:scale(.98)}
  .modal-actions .btn.install{ background:linear-gradient(140deg,var(--accent),#ff9f1c); color:#fff; }
  .modal-actions .btn.install:hover{filter:brightness(1.07)}
  .modal-actions .btn.ghost{ background:transparent; color:var(--muted); box-shadow:inset 0 0 0 1.5px var(--border); }
  .modal-actions .btn.ghost:hover{color:var(--text); box-shadow:inset 0 0 0 1.5px var(--accent)}
  .modal-actions .btn.ghost.on{color:var(--accent); box-shadow:inset 0 0 0 1.5px var(--accent)}
  .modal-note{ font-size:11.5px; line-height:1.5; color:var(--muted); margin:14px 0 0; padding-top:14px; border-top:1px solid var(--border); }

  /* MODAL MISI */
  .mission-modal-content .mission-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; flex-wrap: wrap; }
  .mission-modal-content .mission-title { font-size: 18px; font-weight: 750; margin: 0; display: flex; align-items: center; gap: 8px; }
  .mission-modal-content .mission-points { margin-left: auto; font-size: 13px; font-weight: 800; background: linear-gradient(140deg, var(--accent), #ffb627); color: #fff; padding: 5px 14px; border-radius: 20px; box-shadow: 0 4px 12px -4px rgba(255,107,53,.5); }
  .mission-modal-content .mission-sub { font-size: 12.5px; color: var(--muted); margin: 0 0 20px; }
  .mission-modal-content .mission-overall { margin-bottom: 20px; }
  .mission-modal-content .mission-overall-label { display: flex; justify-content: space-between; font-size: 11.5px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
  .mission-modal-content .progress-track { height: 8px; background: var(--surface-2); border-radius: 8px; overflow: hidden; }
  .mission-modal-content .progress-fill { height: 100%; border-radius: 8px; background: linear-gradient(90deg, var(--accent), #ffb627); transition: width .4s cubic-bezier(.3,1,.4,1); }
  .mission-modal-content .mission-list { display: flex; flex-direction: column; gap: 10px; }
  .mission-modal-content .mission-item { display: flex; align-items: center; gap: 12px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; transition: border-color .2s, background .2s; }
  .mission-modal-content .mission-item.done { border-color: color-mix(in srgb, var(--ok) 45%, var(--border)); background: color-mix(in srgb, var(--ok) 8%, var(--surface)); }
  .mission-modal-content .mission-icon { width: 36px; height: 36px; border-radius: 10px; background: var(--surface); display: grid; place-items: center; font-size: 18px; flex-shrink: 0; }
  .mission-modal-content .mission-item.done .mission-icon { background: color-mix(in srgb, var(--ok) 20%, var(--surface)); }
  .mission-modal-content .mission-body { flex: 1; min-width: 0; }
  .mission-modal-content .mission-name { font-size: 13px; font-weight: 650; margin: 0 0 4px; }
  .mission-modal-content .mission-desc { font-size: 11px; color: var(--muted); margin: 0; }
  .mission-modal-content .mission-bar { height: 5px; background: var(--surface); border-radius: 5px; overflow: hidden; margin-top: 6px; }
  .mission-modal-content .mission-bar-fill { height: 100%; border-radius: 5px; background: var(--ok); transition: width .35s ease; }
  .mission-modal-content .mission-reward { font-size: 11px; font-weight: 800; color: var(--accent); flex-shrink: 0; }
  .mission-modal-content .mission-item.done .mission-reward { color: var(--ok); }
  .mission-modal-content .mission-check { width: 24px; height: 24px; border-radius: 50%; background: var(--ok); color: #fff; display: grid; place-items: center; font-size: 13px; flex-shrink: 0; }

  /* FOOTER & TOAST */
  footer{ text-align:center; font-size:11.5px; color:var(--muted); line-height:1.7; padding:28px 18px 40px; border-top:1px solid var(--border); margin-top:20px; max-width:760px; margin-left:auto; margin-right:auto; }
  #toast{ position:fixed; bottom:26px; left:50%; transform:translate(-50%,20px); background:#0f172a; color:#fff; padding:11px 20px; border-radius:12px; font-size:13px; font-weight:600; z-index:200; opacity:0; pointer-events:none; transition:all .28s cubic-bezier(.2,.9,.3,1.2); box-shadow:0 16px 34px -14px rgba(0,0,0,.6); max-width:90vw; text-align:center; }
  [data-theme="dark"] #toast{background:#e7eefc; color:#0a111f}
  #toast.show{opacity:1; transform:translate(-50%,0)}

  /* RESPONSIF */
  @media (max-width:640px){
    .brand small{display:none}
    .brand h1{font-size:15px}
    .topbar-inner{gap:9px; padding:10px 14px}
    .wrap{padding:16px 14px 60px}
    section{margin-bottom:26px}
    .hero{padding:20px; border-radius:18px; min-height:220px}
    .hero-icon{width:64px; height:64px; font-size:34px; border-radius:16px}
    .hero-text h1{font-size:19px}
    .hero-text p{font-size:12.5px}
    .hero-content{gap:13px}
    .hero-sponsor{top:10px; right:12px; font-size:9px; padding:3px 8px}
    .cat-tile{min-width:72px; padding:9px 6px}
    .cat-tile .cat-emoji{font-size:21px}
    .cat-tile .cat-name{font-size:10px}
    .rank-item{padding:10px 12px; gap:11px}
    .rank-num{font-size:19px; min-width:26px}
    .rank-icon{width:38px; height:38px; font-size:19px}
    .rank-info h3{font-size:12.5px}
    .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px}
    .card{padding:11px}
    .app-icon{width:42px; height:42px; font-size:21px; border-radius:11px}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-logo" aria-label="Logo Appnesia">
        <svg viewBox="0 0 100 100" role="img" aria-hidden="true">
          <defs>
            <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#ff6b35"/>
              <stop offset="100%" stop-color="#ffb627"/>
            </linearGradient>
            <linearGradient id="logoShine" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
              <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
            </linearGradient>
          </defs>
          <rect width="100" height="100" rx="26" fill="url(#logoGrad)"/>
          <rect width="100" height="100" rx="26" fill="url(#logoShine)"/>
          <g stroke="#ffffff" stroke-width="10" stroke-linecap="round" fill="none">
            <path d="M50 27 L75 73"/>
            <path d="M50 27 L25 73"/>
            <path d="M34 61 L66 61"/>
          </g>
        </svg>
      </div>
      <div>
        <h1>Appnesia</h1>
        <small>TOKO APLIKASI NUSANTARA</small>
      </div>
    </div>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
      </svg>
      <input id="search" type="search" placeholder="Cari aplikasi atau pengembang…" autocomplete="off">
    </div>
    <button class="icon-btn" id="missionBtn" title="Misi Harian">🎯</button>
    <button class="icon-btn" id="themeBtn" title="Ganti tema">🌙</button>
  </div>
</header>

<main class="wrap">
  <section class="hero" id="hero"></section>

  <section>
    <h2 class="sec-title">Kategori</h2>
    <div class="cat-scroll" id="cats"></div>
  </section>

  <section id="rankSection">
    <h2 class="sec-title">Peringkat Minggu Ini</h2>
    <ol class="rank-list" id="rankList"></ol>
  </section>

  <section style="margin-bottom:0">
    <div class="section-head">
      <h2 class="sec-title" id="sectionTitle">Jelajahi Aplikasi</h2>
      <span id="countLabel"></span>
    </div>
    <div class="grid" id="grid"></div>
  </section>
</main>

<footer>
  Appnesia bukan toko aplikasi resmi dan tidak berafiliasi dengan Google. Seluruh tombol unduh mengarahkan ke halaman resmi aplikasi di Google Play Store. Favorit tersimpan lokal di perangkatmu.
</footer>

<div class="backdrop" id="backdrop"><div class="modal" id="modal"></div></div>
<div class="backdrop" id="missionBackdrop"><div class="modal mission-modal-content" id="missionModal"></div></div>
<div id="toast"></div>

<script src="data.js"></script>

<!-- LOGIKA UTAMA INDEX.HTML -->
<script>
window.addEventListener('DOMContentLoaded', () => {
  // 1. Cek apakah data.js berhasil dimuat
  if (typeof APPS === 'undefined' || typeof CAT_META === 'undefined') {
    document.getElementById('hero').innerHTML = `<div style="text-align:center; padding: 40px; color: white;"><h2>⚠️ Gagal Memuat Data</h2><p>Pastikan file <b>data.js</b> ada di folder yang sama.</p></div>`;
    return;
  }

  // 2. State Aplikasi
  const state = {
    filter: 'Semua',
    query: '',
    favs: JSON.parse(localStorage.getItem('appnesia:favs') || '{}')
  };
  let openId = null;
  let heroApp = null;
  let heroRendered = false;

  const $ = s => document.querySelector(s);
  const saveFavs = () => localStorage.setItem('appnesia:favs', JSON.stringify(state.favs));
  const grad = c => `linear-gradient(140deg, ${c}, ${c}aa)`;
  const findApp = id => APPS.find(a => a.id === id);
  const storeUrl = app => app.pkg ? `https://play.google.com/store/apps/details?id=${encodeURIComponent(app.pkg)}` : `https://play.google.com/store/search?q=${encodeURIComponent(app.name)}&c=apps`;
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const DL_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`;

  // 3. Render Misi (Mengambil fungsi & variabel dari data.js)
  function renderMissions() {
    if (typeof MISSIONS === 'undefined' || typeof MISSION_STATE === 'undefined') return;
    
    const done = doneCount();
    const total = MISSIONS.length;
    const percent = Math.round((done / total) * 100);

    // Update Badge di Header
    const missionBtn = document.getElementById('missionBtn');
    if(missionBtn){
      const oldBadge = missionBtn.querySelector('.badge-dot');
      if(oldBadge) oldBadge.remove();
      
      const remaining = total - done;
      if(remaining > 0){
        const dot = document.createElement('span');
        dot.className = 'badge-dot';
        dot.textContent = remaining;
        missionBtn.appendChild(dot);
      }
    }

    // Update Modal Misi
    const modalEl = document.getElementById('missionModal');
    if(modalEl){
      const missionItemsHTML = MISSIONS.map(m => {
        const cur = missionProgress(m.id);
        const isDone = cur >= m.goal;
        const pct = Math.round((cur / m.goal) * 100);
        
        return `
          <div class="mission-item${isDone ? ' done' : ''}">
            <div class="mission-icon">${m.icon}</div>
            <div class="mission-body">
              <p class="mission-name">${esc(m.name)} ${isDone ? '<span style="font-size:10px;opacity:.8">✓</span>' : ''}</p>
              <p class="mission-desc">${esc(m.desc)} · ${cur}/${m.goal}</p>
              <div class="mission-bar"><div class="mission-bar-fill" style="width:${pct}%"></div></div>
            </div>
            ${isDone ? `<span class="mission-check">✓</span>` : `<span class="mission-reward">+${m.reward}</span>`}
          </div>`;
      }).join('');

            modalEl.innerHTML = `
        <button class="modal-close" data-mission-close aria-label="Tutup">✕</button>
        <div class="mission-head">
          <h2 class="mission-title"><span>🎯</span> Misi Harian</h2>
          <span class="mission-points">${totalPoints()} Poin</span>
        </div>
        <p class="mission-sub">
          ${done === total ? `🎉 Semua misi hari ini selesai! Kembali besok untuk misi baru.` : 'Selesaikan misi untuk mengumpulkan poin — reset tiap hari.'}
        </p>
        <div class="mission-overall">
          <div class="mission-overall-label">
            <span>${done} / ${total} misi selesai</span>
            <span>${percent}%</span>
          </div>
          <div class="progress-track"><div class="progress-fill" style="width:${percent}%"></div></div>
        </div>
        <div class="mission-list">
          ${missionItemsHTML}
        </div>
      `;
    }
  }

  // Hubungkan fungsi render ke data.js agar bisa dipanggil
  window.renderMissions = renderMissions;

  // 4. Render Aplikasi
  function filteredApps(){
    let list = APPS.slice();
    if(state.filter === 'Favorit') list = list.filter(a => state.favs[a.id]);
    else if(state.filter !== 'Semua') list = list.filter(a => a.cat === state.filter);
    if(state.query){
      const q = state.query.toLowerCase().trim();
      list = list.filter(a => a.name.toLowerCase().includes(q) || a.dev.toLowerCase().includes(q) || a.cat.toLowerCase().includes(q));
    }
    return list;
  }

  function pickHero(){
    const featured = APPS.filter(a => a.featured);
    if(!featured.length) return APPS[0];
    return featured[new Date().getDate() % featured.length];
  }

  function getVideoId(url){
    if(!url) return null;
    const m = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{11})/);
    return m ? m[1] : null;
  }

  function heroHTML(app){
    const ytId = getVideoId(app.video);
    const videoBg = ytId
      ? `<div class="hero-video-wrap"><iframe src="https://www.youtube.com/embed/${ytId}?autoplay=1&mute=1&loop=1&playlist=${ytId}&controls=0&rel=0&playsinline=1&showinfo=0&modestbranding=1" frameborder="0" allow="autoplay; encrypted-media" referrerpolicy="strict-origin-when-cross-origin" aria-hidden="true"></iframe></div><div class="hero-overlay"></div><span class="hero-sponsor">🎬 Video Sponsor</span>`
      : `<div class="hero-video-wrap no-video"></div><div class="hero-overlay"></div>`;

    return `
      ${videoBg}
      <span class="hero-badge">✨ Aplikasi Hari Ini</span>
      <div class="hero-content">
        <div class="hero-icon">${app.icon}</div>
        <div class="hero-text">
          <h1>${esc(app.name)}</h1>
          <p>${esc(app.tagline || app.desc.slice(0, 90))}</p>
          <div class="hero-meta">${esc(app.dev)} · ${esc(app.cat)}</div>
          <div class="hero-actions">
            <a class="hero-btn primary" href="${storeUrl(app)}" target="_blank" rel="noopener">Unduh</a>
            <button class="hero-btn ghost" data-detail="${app.id}">Info</button>
          </div>
        </div>
      </div>`;
  }

  function categoriesHTML(){
    return CAT_META.map(m => {
      const count = m.cat === 'Semua' ? APPS.length : m.cat === 'Favorit' ? Object.keys(state.favs).length : APPS.filter(a => a.cat === m.cat).length;
      return `<button class="cat-tile${m.cat === state.filter ? ' active' : ''}" data-cat="${m.cat}">
        <span class="cat-emoji">${m.emoji}</span>
        <span class="cat-name">${m.cat}</span>
        <span class="cat-count">${count}</span>
      </button>`;
    }).join('');
  }

  function rankHTML(app, pos){
    return `
      <li class="rank-item" data-detail="${app.id}">
        <span class="rank-num">${String(pos).padStart(2, '0')}</span>
        <div class="rank-icon" style="background:${grad(app.color)}">${app.icon}</div>
        <div class="rank-info"><h3>${esc(app.name)}</h3><p>${esc(app.dev)} · ${esc(app.cat)}</p></div>
        <span class="rank-arrow">→</span>
      </li>`;
  }

  function cardHTML(app){
    const fav = state.favs[app.id] ? ' · ★' : '';
    return `
      <article class="card" data-detail="${app.id}">
        <div class="card-top">
          <div class="app-icon" style="background:${grad(app.color)}">${app.icon}</div>
          <a class="mini-dl" href="${storeUrl(app)}" target="_blank" rel="noopener noreferrer" aria-label="Unduh ${esc(app.name)}">${DL_ICON}</a>
        </div>
        <h3 title="${esc(app.name)}">${esc(app.name)}</h3>
        <p class="dev" title="${esc(app.dev)}">${esc(app.dev)}</p>
        <span class="card-cat">${esc(app.cat)}${fav}</span>
      </article>`;
  }

  function emptyHTML(){
    const isFav = state.filter === 'Favorit';
    return `
      <div class="empty">
        <div class="empty-icon">${isFav ? '⭐' : '🔍'}</div>
        <p>${isFav ? 'Belum ada aplikasi favorit' : 'Aplikasi tidak ditemukan'}</p>
        <span>${isFav ? 'Tekan tombol Simpan di halaman detail aplikasi' : 'Coba kata kunci atau kategori lain'}</span>
      </div>`;
  }

  function render(){
    const list = filteredApps();
    const showDiscovery = state.filter === 'Semua' && !state.query;
    const heroEl = $('#hero');

    if(showDiscovery){
      if(!heroApp) heroApp = pickHero();
      if(!heroRendered || heroEl.dataset.heroId !== heroApp.id){
        heroEl.innerHTML = heroHTML(heroApp);
        heroEl.dataset.heroId = heroApp.id;
        heroRendered = true;
      }
      heroEl.dataset.detail = heroApp.id;
      heroEl.hidden = false;
    } else {
      heroEl.hidden = true;
    }

    $('#cats').innerHTML = categoriesHTML();
    $('#rankSection').hidden = !showDiscovery;
    if(showDiscovery){
      const top = APPS.filter(a => a.featured).slice(0, 5);
      $('#rankList').innerHTML = top.map((a, i) => rankHTML(a, i + 1)).join('');
    }

    const title = state.query ? `Hasil: "${state.query}"` : state.filter === 'Semua' ? 'Jelajahi Aplikasi' : state.filter === 'Favorit' ? 'Aplikasi Favoritmu' : `Kategori: ${state.filter}`;
    $('#sectionTitle').textContent = title;
    $('#countLabel').textContent = list.length + ' aplikasi';
    $('#grid').innerHTML = list.length ? list.map(cardHTML).join('') : emptyHTML();
  }

  // 5. Render Modal Aplikasi
  function renderModal(id){
    const app = findApp(id);
    if(!app) return;
    const fav = !!state.favs[app.id];
    $('#modal').innerHTML = `
      <button class="modal-close" data-close aria-label="Tutup">✕</button>
      <div class="modal-head">
        <div class="app-icon big" style="background:${grad(app.color)}">${app.icon}</div>
        <div>
          <h2>${esc(app.name)}</h2>
          <p class="dev">${esc(app.dev)}</p>
          <div class="badge-row"><span class="badge">${esc(app.cat)}</span><span class="badge ok">Resmi Google Play</span></div>
        </div>
      </div>
      <h4>Tentang aplikasi ini</h4>
      <p class="desc">${esc(app.desc)}</p>
      <div class="modal-actions">
        <a class="btn install" href="${storeUrl(app)}" target="_blank" rel="noopener noreferrer">Unduh di Google Play</a>
        <button class="btn ghost ${fav ? 'on' : ''}" data-fav="${app.id}">
          ${fav ? '★ Tersimpan di Favorit' : '☆ Simpan ke Favorit'}
        </button>
      </div>
      <p class="modal-note">Tombol di atas membuka halaman resmi <b>${esc(app.name)}</b> di Google Play Store.</p>`;
  }

  function updateUI(){
    render();
    if(openId) renderModal(openId);
  }

  // 6. Aksi & Toast
  let toastTimer;
  function toast(msg){
    const el = $('#toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
  }

  // Hubungkan fungsi toast ke data.js agar bisa dipanggil
  window.showToast = toast;

  function toggleFav(id){
    if(state.favs[id]) delete state.favs[id];
    else state.favs[id] = true;
    saveFavs();

    if(typeof MISSION_STATE !== 'undefined'){
      const favCount = Object.keys(state.favs).length;
      if(favCount > 0){
        const m = MISSIONS.find(x=>x.id==='save_fav');
        if(m && !MISSION_STATE.claimed.save_fav){
          MISSION_STATE.progress.save_fav = Math.min(favCount, m.goal);
          saveMissionState();
          if(MISSION_STATE.progress.save_fav >= m.goal && !MISSION_STATE.claimed.save_fav){
            MISSION_STATE.claimed.save_fav = true;
            MISSION_STATE.points = (MISSION_STATE.points || 0) + m.reward;
            saveMissionState();
            toast(`🎉 Misi selesai: ${m.name} +${m.reward} poin!`);
          }
        }
      }
    }
    
    updateUI();
    renderMissions();
    const app = findApp(id);
    if(app) toast(state.favs[id] ? `★ ${app.name} disimpan ke favorit` : `☆ ${app.name} dihapus dari favorit`);
  }

  function openDetail(id){
    openId = id;
    renderModal(id);
    $('#backdrop').classList.add('show');
    document.body.style.overflow = 'hidden';

    if(typeof MISSION_STATE !== 'undefined'){
      if(!MISSION_STATE.seenApps) MISSION_STATE.seenApps = [];
      if(!MISSION_STATE.seenApps.includes(id)){
        MISSION_STATE.seenApps.push(id);
        saveMissionState();
      }
      const uniqueCount = MISSION_STATE.seenApps.length;
      const m = MISSIONS.find(x=>x.id==='open_detail');
      if(m && !MISSION_STATE.claimed.open_detail){
        MISSION_STATE.progress.open_detail = Math.min(uniqueCount, m.goal);
        saveMissionState();
        if(MISSION_STATE.progress.open_detail >= m.goal && !MISSION_STATE.claimed.open_detail){
          MISSION_STATE.claimed.open_detail = true;
          MISSION_STATE.points = (MISSION_STATE.points || 0) + m.reward;
          saveMissionState();
          toast(`🎉 Misi selesai: ${m.name} +${m.reward} poin!`);
        }
      }
    }
    renderMissions();
  }

  function closeDetail(){
    openId = null;
    $('#backdrop').classList.remove('show');
    document.body.style.overflow = '';
  }

  function openMissions(){
    renderMissions();
    $('#missionBackdrop').classList.add('show');
    document.body.style.overflow = 'hidden';
  }

  function closeMissions(){
    $('#missionBackdrop').classList.remove('show');
    document.body.style.overflow = '';
  }

  // 7. Event Listeners
  document.addEventListener('click', (e) => {
    // Tombol Misi
    if(e.target.closest('#missionBtn')) {
      e.preventDefault();
      openMissions();
      return;
    }

    // Tutup Modal Misi
    if(e.target.closest('[data-mission-close]') || e.target.id === 'missionBackdrop'){
      closeMissions();
      return;
    }

    if(e.target.closest('a[href]')) return;

    const favEl = e.target.closest('[data-fav]');
    if(favEl){ toggleFav(favEl.dataset.fav); return; }

    if(e.target.closest('[data-close]')){ closeDetail(); return; }

    const catEl = e.target.closest('.cat-tile');
    if(catEl){
      state.filter = catEl.dataset.cat;
      render();

      const cat = catEl.dataset.cat;
      if(cat !== 'Semua' && cat !== 'Favorit' && typeof MISSION_STATE !== 'undefined'){
        if(!MISSION_STATE.seenCats) MISSION_STATE.seenCats = [];
        if(!MISSION_STATE.seenCats.includes(cat)){
          MISSION_STATE.seenCats.push(cat);
          saveMissionState();
        }
        const m = MISSIONS.find(x=>x.id==='browse_cat');
        if(m && !MISSION_STATE.claimed.browse_cat){
          MISSION_STATE.progress.browse_cat = Math.min(MISSION_STATE.seenCats.length, m.goal);
          saveMissionState();
          if(MISSION_STATE.progress.browse_cat >= m.goal && !MISSION_STATE.claimed.browse_cat){
            MISSION_STATE.claimed.browse_cat = true;
            MISSION_STATE.points = (MISSION_STATE.points || 0) + m.reward;
            saveMissionState();
            toast(`🎉 Misi selesai: ${m.name} +${m.reward} poin!`);
          }
        }
        renderMissions();
      }
      window.scrollTo({top:0, behavior:'smooth'});
      return;
    }

    const detailEl = e.target.closest('[data-detail]');
    if(detailEl){ openDetail(detailEl.dataset.detail); return; }

    if(e.target.id === 'backdrop') closeDetail();
  });

  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape'){
      if(openId) closeDetail();
      if(document.getElementById('missionBackdrop').classList.contains('show')) closeMissions();
    }
  });

  $('#search').addEventListener('input', (e) => {
    state.query = e.target.value;
    render();
  });

  // 8. Inisialisasi Tema & Jalan
  const savedTheme = localStorage.getItem('appnesia:theme') || 'light';
  document.documentElement.dataset.theme = savedTheme;
  const themeBtn = $('#themeBtn');
  themeBtn.textContent = savedTheme === 'dark' ? '☀️' : '🌙';

  themeBtn.addEventListener('click', () => {
    const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    localStorage.setItem('appnesia:theme', next);
    themeBtn.textContent = next === 'dark' ? '☀️' : '🌙';
    if(typeof addMissionProgress === 'function') addMissionProgress('switch_theme', 1);
  });

  document.addEventListener('click', (e) => {
    const hero = e.target.closest('#hero');
    if(hero && !e.target.closest('[data-detail]') && !e.target.closest('a[href]')){
      if(typeof addMissionProgress === 'function') addMissionProgress('watch_video', 1);
    }
  });

  heroApp = pickHero();
  render();
  renderMissions();

  setInterval(() => {
    if(typeof MISSION_STATE !== 'undefined' && typeof todayKey === 'function'){
      const today = todayKey();
      if(MISSION_STATE.date !== today){
        MISSION_STATE = loadMissionState();
        saveMissionState();
        renderMissions();
        toast('🌅 Hari baru! Misi harian sudah direset.');
      }
    }
  }, 60 * 1000);
});
</script>
</body>
</html>
